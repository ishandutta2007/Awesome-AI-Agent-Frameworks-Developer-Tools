<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 420"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>@keyframes float1{0%{transform:translate(0,0) scale(1)}}@keyframes float2{0%{transform:translate(0,0) scale(1)}}@keyframes float3{0%{transform:translate(0,0) scale(1)}}@keyframes slideWave{0%{transform:translateX(-50%)}}@keyframes pulseDot{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}.container{position:relative;width:100%;height:420px;background:linear-gradient(135deg,#090d16 0,#0f172a 50%,#030712 100%);border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;box-sizing:border-box;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px rgba(0,0,0,.6)}.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;z-index:1}.orb-1{width:320px;height:320px;background:#6366f1;top:-60px;left:10%;animation:float1 10s ease-in-out infinite alternate}.orb-2{width:360px;height:360px;background:#ec4899;bottom:-80px;right:8%;animation:float2 12s ease-in-out infinite alternate}.orb-3{width:280px;height:280px;background:#06b6d4;top:30%;right:35%;animation:float3 14s ease-in-out infinite alternate}.grid-bg,.wave-line{position:absolute;z-index:2}.grid-bg{inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(circle at center,#000 40%,transparent 80%);-webkit-mask-image:radial-gradient(circle at center,#000 40%,transparent 80%)}.wave-line{width:200%;height:2px;top:65%;background:linear-gradient(90deg,transparent,#38bdf8,#818cf8,#c084fc,transparent);opacity:.35;animation:slideWave 8s linear infinite}.content{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;box-sizing:border-box}.badge-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:9999px;color:#a5b4fc;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.2)}.pulse-dot{width:8px;height:8px;background:#10b981;border-radius:50%;box-shadow:0 0 10px #10b981;animation:pulseDot 2s infinite}h1{margin:0 0 12px;font-size:44px;font-weight:800;letter-spacing:-.025em;line-height:1.15;background:linear-gradient(135deg,#fff 30%,#e0e7ff 70%,#a5b4fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 10px 30px rgba(0,0,0,.5)}p.subtitle{margin:0 0 28px;font-size:19px;font-weight:400;line-height:1.5;color:#94a3b8;max-width:820px}p.subtitle span{color:#f1f5f9;font-weight:600}.features{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.feature-card{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#cbd5e1;font-size:13.5px;font-weight:500;backdrop-filter:blur(8px);transition:all .3s ease}.feature-icon{font-size:15px}</style><div class="container"><div class="orb orb-1"/><div class="orb orb-2"/><div class="orb orb-3"/><div class="grid-bg"/><div class="wave-line"/><div class="content"><div class="badge-pill"><span class="pulse-dot"/>Curated Ecosystem Directory</div><h1>Awesome AI Agent Frameworks &amp; Developer Tools</h1><p class="subtitle">The definitive catalog of<span>Multi-Agent Orchestration</span>,<span>Agent Coding Skills</span>,<span>Structured Output SDKs</span>&amp;<span>Production Observability</span>.</p><div class="features"><div class="feature-card"><span class="feature-icon">🤖</span>Multi-Agent Graph Workflows</div><div class="feature-card"><span class="feature-icon">⚡</span>Type-Safe Structured SDKs</div><div class="feature-card"><span class="feature-icon">🛠️</span>MCP &amp; Agent Tooling</div><div class="feature-card"><span class="feature-icon">📊</span>Tracing &amp; Evals Observability</div><div class="feature-card"><span class="feature-icon">🌐</span>Autonomous Web &amp; Coding Agents</div></div></div></div></div></foreignObject></svg>